name: Deploy on release

# When a release is published, dispatch the Pages deploy workflow against
# main. We need this indirection because the github-pages environment is
# protected to default-branch-only, and `release:` events fire on the tag
# ref, which gets rejected.

on:
  release:
    types: [published]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages deploy on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
